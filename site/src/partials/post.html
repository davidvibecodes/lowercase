<article class="post">
  <header class="post-head wrap-narrow">
    <a class="back" href="/blog/">← All posts</a>
    <span class="tag">{{POST_TAG}}</span>
    <h1>{{POST_TITLE}}</h1>
    <p class="meta"><time datetime="{{POST_ISO}}">{{POST_DATE}}</time> · {{POST_MINUTES}} min read</p>
  </header>
  <div class="prose wrap-narrow">
{{POST_BODY}}
  </div>
  <aside class="post-cta wrap-narrow">
    <div class="card">
      <h2>Practise this on a real case</h2>
      <p>lowercase walks you through the concept, then puts you in a live case where facts arrive only when you ask the right question.</p>
      <a class="btn btn-primary" href="{{LOGIN}}">Start practising</a>
    </div>
  </aside>
</article>
